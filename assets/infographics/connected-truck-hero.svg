<svg viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A Canadian semi-truck connected to ELD, ECM, GPS, AI camera, driver app, cloud and fleet dashboard modules, with data flowing into one dashboard">
  <defs>
    <linearGradient id="skyfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf7f8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00abbe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00abbe" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="720" height="560" fill="url(#skyfade)"/>
  <circle cx="360" cy="300" r="230" fill="url(#glow)"/>

  <circle cx="360" cy="300" r="150" fill="none" stroke="#00abbe" stroke-width="1" opacity="0.25"/>
  <circle cx="360" cy="300" r="205" fill="none" stroke="#00abbe" stroke-width="1" opacity="0.15"/>

  <rect x="0" y="470" width="720" height="90" fill="#003c42" opacity="0.5"/>
  <line x1="0" y1="480" x2="720" y2="480" stroke="#ffffff" stroke-width="3" stroke-dasharray="26 18" opacity="0.6"/>

  <g transform="translate(230,260)">
    <rect x="0" y="40" width="200" height="60" rx="6" fill="#003c42"/>
    <rect x="200" y="10" width="70" height="90" rx="8" fill="#f99e4b"/>
    <rect x="212" y="24" width="42" height="30" rx="4" fill="#bfe9ee"/>
    <rect x="0" y="10" width="196" height="34" rx="4" fill="#00808e"/>
    <circle cx="40" cy="104" r="20" fill="#17181a"/>
    <circle cx="40" cy="104" r="8" fill="#cfd6d7"/>
    <circle cx="150" cy="104" r="20" fill="#17181a"/>
    <circle cx="150" cy="104" r="8" fill="#cfd6d7"/>
    <circle cx="240" cy="104" r="20" fill="#17181a"/>
    <circle cx="240" cy="104" r="8" fill="#cfd6d7"/>
    <rect x="205" y="18" width="60" height="8" rx="2" fill="#f99e4b"/>
  </g>

  
  <g>
    <line x1="120" y1="90" x2="360" y2="300" stroke="#00abbe" stroke-width="2" stroke-dasharray="4 5" opacity="0.55"/>
    <circle cx="120" cy="90" r="34" fill="#00abbe" stroke="#00808e" stroke-width="2"/>
    <text x="120" y="90" font-size="28" text-anchor="middle" dominant-baseline="central">📋</text>
    <text x="120" y="144" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#17181a" text-anchor="middle">ELD</text>
    <text x="120" y="160" font-family="Arial, sans-serif" font-size="11" fill="#5c6d70" text-anchor="middle">HOS &amp; logs</text>
  </g>
  <g>
    <line x1="360" y1="60" x2="360" y2="300" stroke="#00abbe" stroke-width="2" stroke-dasharray="4 5" opacity="0.55"/>
    <circle cx="360" cy="60" r="34" fill="#00abbe" stroke="#00808e" stroke-width="2"/>
    <text x="360" y="60" font-size="28" text-anchor="middle" dominant-baseline="central">🧠</text>
    <text x="360" y="114" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#17181a" text-anchor="middle">ECM</text>
    <text x="360" y="130" font-family="Arial, sans-serif" font-size="11" fill="#5c6d70" text-anchor="middle">Engine data</text>
  </g>
  <g>
    <line x1="600" y1="90" x2="360" y2="300" stroke="#00abbe" stroke-width="2" stroke-dasharray="4 5" opacity="0.55"/>
    <circle cx="600" cy="90" r="34" fill="#00abbe" stroke="#00808e" stroke-width="2"/>
    <text x="600" y="90" font-size="28" text-anchor="middle" dominant-baseline="central">📍</text>
    <text x="600" y="144" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#17181a" text-anchor="middle">GPS</text>
    <text x="600" y="160" font-family="Arial, sans-serif" font-size="11" fill="#5c6d70" text-anchor="middle">Live location</text>
  </g>
  <g>
    <line x1="90" y1="330" x2="360" y2="300" stroke="#00abbe" stroke-width="2" stroke-dasharray="4 5" opacity="0.55"/>
    <circle cx="90" cy="330" r="34" fill="#00abbe" stroke="#00808e" stroke-width="2"/>
    <text x="90" y="330" font-size="28" text-anchor="middle" dominant-baseline="central">🎥</text>
    <text x="90" y="384" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#17181a" text-anchor="middle">AI Camera</text>
    <text x="90" y="400" font-family="Arial, sans-serif" font-size="11" fill="#5c6d70" text-anchor="middle">Video events</text>
  </g>
  <g>
    <line x1="630" y1="330" x2="360" y2="300" stroke="#00abbe" stroke-width="2" stroke-dasharray="4 5" opacity="0.55"/>
    <circle cx="630" cy="330" r="34" fill="#00abbe" stroke="#00808e" stroke-width="2"/>
    <text x="630" y="330" font-size="28" text-anchor="middle" dominant-baseline="central">📱</text>
    <text x="630" y="384" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#17181a" text-anchor="middle">Driver App</text>
    <text x="630" y="400" font-family="Arial, sans-serif" font-size="11" fill="#5c6d70" text-anchor="middle">In-cab access</text>
  </g>
  <g>
    <line x1="220" y1="470" x2="360" y2="300" stroke="#00abbe" stroke-width="2" stroke-dasharray="4 5" opacity="0.55"/>
    <circle cx="220" cy="470" r="34" fill="#00abbe" stroke="#00808e" stroke-width="2"/>
    <text x="220" y="470" font-size="28" text-anchor="middle" dominant-baseline="central">☁️</text>
    <text x="220" y="524" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#17181a" text-anchor="middle">Cloud</text>
    <text x="220" y="540" font-family="Arial, sans-serif" font-size="11" fill="#5c6d70" text-anchor="middle">Secure sync</text>
  </g>
  <g>
    <line x1="500" y1="470" x2="360" y2="300" stroke="#00abbe" stroke-width="2" stroke-dasharray="4 5" opacity="0.55"/>
    <circle cx="500" cy="470" r="34" fill="#00abbe" stroke="#00808e" stroke-width="2"/>
    <text x="500" y="470" font-size="28" text-anchor="middle" dominant-baseline="central">📊</text>
    <text x="500" y="524" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#17181a" text-anchor="middle">Dashboard</text>
    <text x="500" y="540" font-family="Arial, sans-serif" font-size="11" fill="#5c6d70" text-anchor="middle">Fleet visibility</text>
  </g>
</svg>